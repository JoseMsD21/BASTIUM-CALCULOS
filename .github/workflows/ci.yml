name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Sprint 122: 3.15 es la version principal recomendada (target-version de
        # ruff en pyproject.toml); suite completa verificada en 3.15.2 el
        # 2026-11-23. 3.13 sigue como piso minimo verificado (Sprint 113) -- el
        # codigo usa generics PEP 695 (ej. app/services/cascada_cuotas.py), asi
        # que 3.12 seria el minimo real -- y 3.14 se mantiene porque la regla de
        # proteccion de `main` exige los checks "test (3.13)" y "test (3.14)":
        # quitar una version de la matriz dejaria los PR bloqueados esperando un
        # check que ya no existe.
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr ruff (lint)
        run: python -m ruff check .

      - name: Correr pytest con cobertura
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov=app --cov=database --cov-report=term-missing --cov-fail-under=90
